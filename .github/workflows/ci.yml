name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  servidor:
    name: Servidor (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v tests

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  firmware:
    name: Firmware ESP32 (compilación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Credenciales de ejemplo para compilar
        run: cp firmware/dashboard_emt/secrets.example.h firmware/dashboard_emt/secrets.h
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: ArduinoJson
            - name: Adafruit GFX Library
            - name: Adafruit ILI9341
            - name: XPT2046_Touchscreen
          sketch-paths: |
            - firmware/dashboard_emt
          enable-warnings-report: true
